<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Status — Glorikar Engineering</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main-content">

    <header class="page-header">
      <div class="page-header-left">
        <a href="my-bookings.html" class="btn-icon" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div class="page-title">Booking Status</div>
      </div>
      <div id="status-badge-header"></div>
    </header>

    <div id="new-banner" class="hidden" style="
      background: rgba(34,197,94,0.08);
      border-bottom: 1px solid var(--status-completed);
      padding: var(--sp-sm) var(--sp-md);
      font: 500 13px/18px Inter;
      color: var(--status-completed);
      display:flex;align-items:center;gap:var(--sp-sm)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      Booking submitted successfully! We'll notify you when it's scheduled.
    </div>

    <div class="page" id="booking-content">
      <!-- Skeleton -->
      <div id="skeleton" class="stack stack-md mt-md">
        <div class="skeleton" style="height:80px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:120px;border-radius:var(--r-md)"></div>
        <div class="skeleton" style="height:160px;border-radius:var(--r-md)"></div>
      </div>
    </div>

  </main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script type="module">
import { requireAuth } from '../assets/js/auth.js';
import { renderNav } from '../assets/js/nav.js';
import { get } from '../assets/js/api.js';

await requireAuth();
renderNav();

const params    = new URLSearchParams(window.location.search);
const bookingId = params.get('id');
const isNew     = params.get('new') === '1';

if (!bookingId) { window.location.href = 'my-bookings.html'; }
if (isNew) { document.getElementById('new-banner').classList.remove('hidden'); }

const statusOrder = ['pending','scheduled','en_route','in_progress','completed'];
const statusLabel = { pending:'Pending', scheduled:'Scheduled', en_route:'En Route', in_progress:'In Progress', completed:'Completed', cancelled:'Cancelled' };
const statusClass = { pending:'pending', scheduled:'scheduled', en_route:'en-route', in_progress:'in-progress', completed:'completed', cancelled:'cancelled' };
const statusDesc  = {
  pending:     'Your booking is waiting to be scheduled. Our system runs nightly to assign your visit.',
  scheduled:   'Your visit is scheduled. You\'ll be notified when the technician is dispatched.',
  en_route:    'Your technician is on the way. Estimated arrival shown below.',
  in_progress: 'Service is currently underway at your location.',
  completed:   'Service completed. Your invoice has been generated.',
  cancelled:   'This booking was cancelled.',
};

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-PH', { month: 'long', day: 'numeric', year: 'numeric' });
}

async function loadBooking() {
  const content  = document.getElementById('booking-content');
  const skeleton = document.getElementById('skeleton');
  try {
    const data    = await get(`/api/bookings/get.php?id=${bookingId}`);
    const b       = data.booking;

    skeleton.remove();

    // Header badge
    document.getElementById('status-badge-header').innerHTML =
      `<span class="badge badge-${statusClass[b.status] || 'pending'}">${statusLabel[b.status] || b.status}</span>`;

    const idx      = statusOrder.indexOf(b.status);
    const isCancelled = b.status === 'cancelled';

    content.innerHTML = `
      <!-- Status progress -->
      <div class="card mt-md">
        <div class="body-sm text-secondary">${statusDesc[b.status] || ''}</div>
        ${!isCancelled ? `
        <div class="row" style="gap:var(--sp-xs);margin-top:var(--sp-md);overflow-x:auto">
          ${statusOrder.map((s, i) => `
            <div style="display:flex;align-items:center;gap:var(--sp-xs);flex-shrink:0">
              <div style="
                width:28px;height:28px;border-radius:50%;
                background:${i <= idx ? 'var(--accent)' : 'var(--surface-raised)'};
                border:1.5px solid ${i <= idx ? 'var(--accent)' : 'var(--border)'};
                color:${i <= idx ? 'var(--white)' : 'var(--text-disabled)'};
                display:grid;place-content:center;
                font:600 11px/1 Inter;flex-shrink:0">
                ${i < idx ? '✓' : i + 1}
              </div>
              <span class="label-sm" style="color:${i <= idx ? 'var(--text-primary)' : 'var(--text-disabled)'};white-space:nowrap">${statusLabel[s]}</span>
              ${i < statusOrder.length - 1 ? `<div style="width:16px;height:1px;background:${i < idx ? 'var(--accent)' : 'var(--border)'}"></div>` : ''}
            </div>`).join('')}
        </div>` : ''}
      </div>

      <!-- ETA block (en route only) -->
      ${b.status === 'en_route' ? `
      <div class="card mt-md" style="border-color:var(--status-en-route);background:rgba(14,165,233,0.06)">
        <div class="label-sm text-secondary">Estimated arrival</div>
        <div class="display-sm mt-xs" style="color:var(--status-en-route)">${b.eta || 'Being updated…'}</div>
        <div class="body-sm text-secondary mt-sm">Track your technician's location in real time.</div>
      </div>` : ''}

      <!-- Services -->
      <div class="section-header mt-lg mb-sm">Services booked</div>
      <div class="card" style="padding:0;overflow:hidden">
        ${(b.services || []).map(s => `
          <div class="list-row" style="cursor:default">
            <div class="list-row-body">
              <div class="list-row-title">${s.name}</div>
            </div>
            <div class="label-sm text-secondary">Qty ${s.quantity}</div>
          </div>`).join('') || '<div class="p-md body-sm text-secondary">No services found.</div>'}
      </div>

      <!-- Visit details -->
      <div class="section-header mt-lg mb-sm">Visit details</div>
      <div class="card">
        <div class="stack stack-sm">
          <div class="row-between"><span class="label-sm text-secondary">Preferred window</span>
            <span class="label-lg">${fmtDate(b.preferred_date_from)}${b.preferred_date_to !== b.preferred_date_from ? ' – ' + fmtDate(b.preferred_date_to) : ''}</span>
          </div>
          ${b.scheduled_date ? `
          <hr class="divider">
          <div class="row-between"><span class="label-sm text-secondary">Scheduled date</span>
            <span class="label-lg" style="color:var(--accent)">${fmtDate(b.scheduled_date)}</span>
          </div>` : ''}
          ${b.team_name ? `
          <hr class="divider">
          <div class="row-between"><span class="label-sm text-secondary">Assigned team</span>
            <span class="label-lg">${b.team_name}</span>
          </div>` : ''}
          <hr class="divider">
          <div class="row-between" style="align-items:flex-start"><span class="label-sm text-secondary">Address</span>
            <span class="label-lg" style="text-align:right;max-width:200px">${b.address}</span>
          </div>
        </div>
      </div>

      ${b.notes ? `
      <div class="section-header mt-lg mb-sm">Notes</div>
      <div class="card"><p class="body-sm">${b.notes}</p></div>` : ''}

      <!-- Invoice (completed) -->
      ${b.status === 'completed' && b.invoice ? `
      <div class="section-header mt-lg mb-sm">Invoice</div>
      <div class="card">
        ${(b.invoice.items || []).map(l => `
          <div class="invoice-row"><span>${l.name}</span><span class="invoice-amount">₱${Number(l.amount).toLocaleString()}</span></div>`).join('')}
        <div class="invoice-row total">
          <span>Total</span>
          <span class="invoice-amount">₱${Number(b.invoice.total_amount).toLocaleString()}</span>
        </div>
        <div class="row-between mt-md">
          <span class="badge ${b.invoice.paid ? 'badge-completed' : 'badge-pending'}">${b.invoice.paid ? 'Paid' : 'Payment pending'}</span>
        </div>
      </div>` : ''}

      <div style="height:var(--sp-xxl)"></div>
    `;
  } catch (err) {
    skeleton.innerHTML = `
      <div class="error-state mt-lg">
        <div class="error-state-title">Could not load booking</div>
        <div class="error-state-body">${err.message}</div>
        <button class="btn btn-ghost btn-sm mt-sm" onclick="location.reload()">Retry</button>
      </div>`;
  }
}

loadBooking();

// Auto-refresh on active statuses
let refreshInterval;
function maybeAutoRefresh(status) {
  if (['en_route','in_progress'].includes(status)) {
    refreshInterval = setInterval(loadBooking, 30000);
  }
}
</script>
</body>
</html>
