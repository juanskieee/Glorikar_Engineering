<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jobs — Glorikar Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/theme.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/layout.css"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">

    <div class="page">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">Jobs</div>
          <div class="page-subtitle">All service bookings</div>
        </div>
      </div>

      <!-- Search + filter bar -->
      <div class="action-bar mt-md">
        <div class="row" style="gap:var(--sp-sm);flex:1">
          <input class="input" id="search-input" placeholder="Search client, address…" style="max-width:280px"/>
          <div class="select-wrap">
            <select class="input" id="status-filter" style="width:160px">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="scheduled">Scheduled</option>
              <option value="en_route">En Route</option>
              <option value="in_progress">In Progress</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <input class="input" id="date-filter" type="date" style="width:160px"/>
        </div>
      </div>

      <div id="jobs-container" class="mt-md">
        <div class="skeleton-card" style="height:64px;border-radius:var(--r-md);margin-bottom:var(--sp-sm)"></div>
        <div class="skeleton-card" style="height:64px;border-radius:var(--r-md);margin-bottom:var(--sp-sm)"></div>
        <div class="skeleton-card" style="height:64px;border-radius:var(--r-md);margin-bottom:var(--sp-sm)"></div>
        <div class="skeleton-card" style="height:64px;border-radius:var(--r-md)"></div>
      </div>
    </div>

  </main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script type="module">
import { requireAdmin } from '../assets/js/auth.js';
import { renderNav }    from '../assets/js/nav.js';
import { get }          from '../assets/js/api.js';

await requireAdmin();
renderNav();

const statusClass = {
  pending: 'pending', scheduled: 'scheduled', en_route: 'en-route',
  in_progress: 'in-progress', completed: 'completed', cancelled: 'cancelled',
};
const statusLabel = {
  pending: 'Pending', scheduled: 'Scheduled', en_route: 'En Route',
  in_progress: 'In Progress', completed: 'Completed', cancelled: 'Cancelled',
};

// Pre-fill filters from URL params
const params = new URLSearchParams(location.search);
if (params.get('filter'))  document.getElementById('status-filter').value = params.get('filter');
if (params.get('date'))    document.getElementById('date-filter').value = params.get('date');

let allJobs = [];

function fmtDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
}

function renderJobs(list) {
  const el = document.getElementById('jobs-container');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state mt-lg">
      <div class="empty-state-icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="empty-state-title">No jobs found</div>
      <div class="empty-state-body">Try adjusting the filters.</div>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="card" style="padding:0;overflow:hidden">
    ${list.map(j => `
      <a href="job-detail.html?id=${j.id}" class="list-row">
        <div class="list-row-body">
          <div class="list-row-title">${j.client_name}</div>
          <div class="list-row-sub">${j.services?.join(', ')} · ${j.address}</div>
          <div class="list-row-sub mt-xs">${fmtDate(j.scheduled_date || j.preferred_date_from)}${j.team_name ? ' · ' + j.team_name : ''}</div>
        </div>
        <div class="list-row-meta">
          <span class="badge badge-${statusClass[j.status] || 'pending'}">${statusLabel[j.status] || j.status}</span>
        </div>
      </a>`).join('')}
  </div>`;
}

function applyFilters() {
  const q      = document.getElementById('search-input').value.toLowerCase();
  const status = document.getElementById('status-filter').value;
  const date   = document.getElementById('date-filter').value;

  let list = allJobs;
  if (q)      list = list.filter(j => (j.client_name + j.address).toLowerCase().includes(q));
  if (status) list = list.filter(j => j.status === status);
  if (date)   list = list.filter(j => (j.scheduled_date || j.preferred_date_from) === date);
  renderJobs(list);
}

async function loadJobs() {
  try {
    const data = await get('/api/admin/jobs.php');
    allJobs = data.jobs || [];
    applyFilters();
  } catch (err) {
    document.getElementById('jobs-container').innerHTML = `
      <div class="error-state mt-lg">
        <div class="error-state-title">Could not load jobs</div>
        <div class="error-state-body">${err.message}</div>
        <button class="btn btn-ghost btn-sm mt-sm" onclick="location.reload()">Retry</button>
      </div>`;
  }
}

document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('status-filter').addEventListener('change', applyFilters);
document.getElementById('date-filter').addEventListener('change', applyFilters);

loadJobs();
</script>
</body>
</html>
