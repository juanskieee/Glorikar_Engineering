<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schedule — Glorikar Engineering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../assets/css/theme.css"/>
  <link rel="stylesheet" href="../assets/css/components.css"/>
  <link rel="stylesheet" href="../assets/css/layout.css"/>
  <style>
    .schedule-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
    }
    .schedule-day-header {
      padding: var(--sp-sm) var(--sp-md);
      background: var(--surface-raised);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .schedule-day-date { font: 600 13px/16px 'Inter'; color: var(--text-primary); }
    .schedule-day-sub  { font: 400 11px/14px 'Inter'; color: var(--text-secondary); }
    .schedule-team-block {
      padding: var(--sp-sm) var(--sp-md);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: var(--sp-md);
      align-items: flex-start;
    }
    .schedule-team-block:last-child { border-bottom: none; }
    .schedule-team-name { font: 500 13px/16px 'Inter'; color: var(--text-primary); min-width: 100px; }
    .schedule-jobs { display: flex; flex-wrap: wrap; gap: var(--sp-xs); flex: 1; }
    .schedule-job-chip {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      padding: var(--sp-xs) var(--sp-sm);
      font: 400 12px/16px 'Inter';
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
      text-decoration: none;
    }
    .schedule-job-chip:hover { background: var(--accent); border-color: var(--accent); color: var(--white); }
    .week-nav { display: flex; align-items: center; gap: var(--sp-sm); }
    .week-label { font: 500 14px/20px 'Inter'; color: var(--text-primary); min-width: 180px; text-align: center; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">

    <div class="page">
      <div class="page-header">
        <div class="page-header-left">
          <div class="page-title">Schedule</div>
          <div class="page-subtitle">Weekly job assignments by team</div>
        </div>
        <a href="jobs.html?filter=pending" class="btn btn-ghost btn-sm">Unscheduled Jobs</a>
      </div>

      <!-- Week navigation -->
      <div class="row row-between mt-md">
        <div class="week-nav">
          <button class="btn-icon" id="prev-week-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="week-label" id="week-label">Loading…</div>
          <button class="btn-icon" id="next-week-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <button class="btn btn-ghost btn-sm" id="today-btn">Today</button>
      </div>

      <div id="schedule-grid" class="stack stack-sm mt-md">
        <div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>
        <div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>
        <div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>
        <div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>
        <div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>
      </div>
    </div>

  </main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
import { requireAdmin } from '../assets/js/auth.js';
import { renderNav }    from '../assets/js/nav.js';
import { get }          from '../assets/js/api.js';

await requireAdmin();
renderNav();

let weekOffset = 0;

function getWeekStart(offset = 0) {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff + offset * 7);
  d.setHours(0, 0, 0, 0);
  return d;
}

function fmtShort(d) {
  return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}
function fmtDay(d) {
  return d.toLocaleDateString('en-PH', { weekday: 'short', month: 'short', day: 'numeric' });
}
function isoDate(d) {
  return d.toISOString().split('T')[0];
}

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const statusClass = {
  pending: 'pending', scheduled: 'scheduled', en_route: 'en-route',
  in_progress: 'in-progress', completed: 'completed', cancelled: 'cancelled',
};

function toast(msg, type = 'info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

async function loadSchedule() {
  const weekStart = getWeekStart(weekOffset);
  const weekEnd   = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);

  document.getElementById('week-label').textContent = `${fmtShort(weekStart)} – ${fmtShort(weekEnd)}`;

  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = Array(5).fill(`<div class="skeleton-card" style="height:100px;border-radius:var(--r-md)"></div>`).join('');

  try {
    const data = await get(`/api/admin/schedule.php?from=${isoDate(weekStart)}&to=${isoDate(weekEnd)}`);
    const { days } = data; // Array of { date, jobs_by_team: [{team_id, team_name, jobs:[...]}] }

    if (!days?.length) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-state-title">No schedule data</div><div class="empty-state-body">No jobs scheduled for this week.</div></div>`;
      return;
    }

    grid.innerHTML = days.map((day, i) => {
      const d = new Date(weekStart); d.setDate(d.getDate() + i);
      const isToday = isoDate(d) === isoDate(new Date());
      return `
        <div class="schedule-day">
          <div class="schedule-day-header">
            <div>
              <div class="schedule-day-date${isToday ? ' text-accent' : ''}">${fmtDay(d)}${isToday ? ' · Today' : ''}</div>
              <div class="schedule-day-sub">${day.total_jobs ?? 0} job${day.total_jobs !== 1 ? 's' : ''}</div>
            </div>
            <a href="jobs.html?date=${isoDate(d)}" class="btn btn-ghost btn-sm">View</a>
          </div>
          ${day.jobs_by_team?.length ? day.jobs_by_team.map(t => `
            <div class="schedule-team-block">
              <div class="schedule-team-name">${t.team_name}</div>
              <div class="schedule-jobs">
                ${t.jobs.map(j => `
                  <a href="job-detail.html?id=${j.id}" class="schedule-job-chip">
                    ${j.client_name} · <span style="color:var(--text-secondary)">${j.services?.join(', ')}</span>
                  </a>`).join('')}
              </div>
            </div>`).join('') : `<div class="schedule-team-block"><div class="label-sm text-disabled">No jobs assigned</div></div>`}
        </div>`;
    }).join('');

  } catch (err) {
    grid.innerHTML = `<div class="error-state"><div class="error-state-title">Failed to load schedule</div><div class="error-state-body">${err.message}</div><button class="btn btn-ghost btn-sm mt-sm" onclick="loadSchedule()">Retry</button></div>`;
  }
}

document.getElementById('prev-week-btn').addEventListener('click', () => { weekOffset--; loadSchedule(); });
document.getElementById('next-week-btn').addEventListener('click', () => { weekOffset++; loadSchedule(); });
document.getElementById('today-btn').addEventListener('click', () => { weekOffset = 0; loadSchedule(); });

loadSchedule();
</script>
</body>
</html>
