; ═══════════════════════════════════════════════════════════
;  GLORIKAR — backend/php-production.ini
;  Reference settings for the PHP runtime in production.
;  Copy these values into your php.ini on the production server
;  (or apply via PHP ini_set / FPM pool config).
; ═══════════════════════════════════════════════════════════

display_errors = Off
log_errors = On
error_log = /path/to/backend/logs/php-errors.log
expose_php = Off

session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 1800